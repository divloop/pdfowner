<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>PDF Reader - Secured</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #0f0f11; color: #e8e8f0;
    height: 100dvh; display: flex;
    align-items: center; justify-content: center; overflow: hidden;
  }
  .lock-card {
    background: #18181c; border: 1px solid #2e2e38; border-radius: 16px;
    padding: 40px 36px 36px; width: 360px; max-width: 92vw;
    box-shadow: 0 24px 80px rgba(0,0,0,0.7);
    display: flex; flex-direction: column; align-items: center;
  }
  .lock-icon {
    width: 56px; height: 56px;
    background: rgba(79,142,247,0.12); border: 1px solid rgba(79,142,247,0.25);
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    margin-bottom: 20px;
  }
  .lock-icon svg { width: 26px; height: 26px; color: #4f8ef7; }
  .lock-title { font-size: 18px; font-weight: 600; margin-bottom: 6px; }
  .lock-sub {
    font-size: 12px; color: #4a4a5a; font-family: monospace;
    margin-bottom: 28px; text-align: center;
  }
  .pw-wrap { width: 100%; position: relative; margin-bottom: 14px; }
  .pw-wrap input {
    width: 100%; padding: 13px 44px 13px 16px;
    background: #222228; border: 1px solid #2e2e38; border-radius: 10px;
    color: #e8e8f0; font-size: 15px; font-family: inherit; outline: none;
    transition: border-color 0.2s; letter-spacing: 0.05em;
  }
  .pw-wrap input:focus { border-color: #4f8ef7; }
  .pw-wrap input.error { border-color: #ef4444; animation: shake 0.35s ease; }
  .pw-toggle {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    background: none; border: none; cursor: pointer; color: #4a4a5a; transition: color 0.15s;
  }
  .pw-toggle:hover { color: #7a7a8c; }
  .unlock-btn {
    width: 100%; padding: 13px; background: #4f8ef7; border: none; border-radius: 10px;
    color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background 0.15s; font-family: inherit;
  }
  .unlock-btn:hover { background: #3d7ef5; }
  .unlock-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .status-msg {
    margin-top: 14px; font-size: 12px; text-align: center;
    min-height: 18px; font-family: monospace; color: #4a4a5a;
  }
  .status-msg.error { color: #ef4444; }
  .status-msg.loading { color: #4f8ef7; }
  @keyframes shake {
    0%,100% { transform:translateX(0); } 20% { transform:translateX(-8px); }
    40% { transform:translateX(8px); }  60% { transform:translateX(-5px); }
    80% { transform:translateX(5px); }
  }
  @keyframes spin { to { transform:rotate(360deg); } }
  .spinner {
    display: inline-block; width: 12px; height: 12px;
    border: 2px solid rgba(79,142,247,0.3); border-top-color: #4f8ef7;
    border-radius: 50%; animation: spin 0.7s linear infinite;
    vertical-align: middle; margin-right: 6px;
  }
  #app-frame {
    display: none; position: fixed; inset: 0;
    width: 100%; height: 100%; border: none; z-index: 100;
  }
</style>
</head>
<body>
<div class="lock-card" id="lock-card">
  <div class="lock-icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="3" y="11" width="18" height="11" rx="2"/>
      <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
    </svg>
  </div>
  <div class="lock-title">PDF Reader</div>
  <div class="lock-sub">AES-256-GCM &nbsp;/&nbsp; PBKDF2 &nbsp;/&nbsp; 200K rounds</div>
  <div class="dz-sub">Designed by Sandeep Yadav : Made with ❤️</div>
  <div class="pw-wrap">
    <input type="password" id="pw-input" placeholder="Enter password"
           autocomplete="current-password" autofocus>
    <button class="pw-toggle" id="pw-toggle" type="button">
      <svg id="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2">
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
    </button>
  </div>
  <button class="unlock-btn" id="unlock-btn">Unlock</button>
  <div class="status-msg" id="status-msg"></div>
</div>
<iframe id="app-frame"
  sandbox="allow-scripts allow-same-origin allow-downloads allow-forms allow-modals allow-popups">
</iframe>

<script>
// Salt and IV are non-secret (safe to expose - useless without the password)
const SALT_B64 = "vOUZvXMGZpe0avhrfgbQyA==";
const IV_B64   = "Kn4FtQcFLwM7/H/i";

// Encrypted payload is loaded from cipher.b64 (same folder as this file)
// This keeps this HTML file small and editable on GitHub
const CIPHER_URL = "cipher.b64";

const pwInput   = document.getElementById('pw-input');
const unlockBtn = document.getElementById('unlock-btn');
const statusMsg = document.getElementById('status-msg');
const lockCard  = document.getElementById('lock-card');
const appFrame  = document.getElementById('app-frame');

// Show / hide password
let pwVisible = false;
document.getElementById('pw-toggle').addEventListener('click', function() {
  pwVisible = !pwVisible;
  pwInput.type = pwVisible ? 'text' : 'password';
  document.getElementById('eye-icon').innerHTML = pwVisible
    ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>'
    : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
});

pwInput.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') unlockBtn.click();
});

unlockBtn.addEventListener('click', async function() {
  const password = pwInput.value;
  if (!password) { pwInput.focus(); return; }

  unlockBtn.disabled = true;
  statusMsg.className = 'status-msg loading';
  statusMsg.innerHTML = '<span class="spinner"></span>Loading encrypted data...';

  try {
    await new Promise(r => setTimeout(r, 30));

    // Fetch cipher.b64 from same directory
    const res = await fetch(CIPHER_URL);
    if (!res.ok) throw new Error('Could not load cipher.b64 (HTTP ' + res.status + ')');
    const cipherB64 = (await res.text()).trim();

    statusMsg.innerHTML = '<span class="spinner"></span>Deriving key (200K rounds)...';
    await new Promise(r => setTimeout(r, 30));

    function b64ToBytes(b64) {
      const bin = atob(b64);
      const a = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
      return a;
    }

    const salt       = b64ToBytes(SALT_B64);
    const iv         = b64ToBytes(IV_B64);
    const ciphertext = b64ToBytes(cipherB64);

    // Import password as PBKDF2 key material
    const keyMaterial = await crypto.subtle.importKey(
      'raw', new TextEncoder().encode(password),
      { name: 'PBKDF2' }, false, ['deriveKey']
    );

    // Derive AES-256-GCM key
    const aesKey = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt, iterations: 200000, hash: 'SHA-256' },
      keyMaterial,
      { name: 'AES-GCM', length: 256 },
      false, ['decrypt']
    );

    statusMsg.innerHTML = '<span class="spinner"></span>Decrypting...';
    await new Promise(r => setTimeout(r, 20));

    // Decrypt — AES-GCM authentication tag check happens here
    // Wrong password = decryption throws, caught below
    const decrypted = await crypto.subtle.decrypt(
      { name: 'AES-GCM', iv },
      aesKey,
      ciphertext
    );

    const html = new TextDecoder('utf-8').decode(decrypted);

    statusMsg.innerHTML = '<span class="spinner"></span>Loading app...';
    await new Promise(r => setTimeout(r, 20));

    // Load decrypted HTML into sandboxed iframe via blob URL
    const blob = new Blob([html], { type: 'text/html' });
    const url  = URL.createObjectURL(blob);
    appFrame.src = url;
    appFrame.onload = function() {
      lockCard.style.transition = 'opacity 0.4s ease';
      lockCard.style.opacity = '0';
      setTimeout(function() {
        lockCard.style.display = 'none';
        appFrame.style.display = 'block';
        URL.revokeObjectURL(url);
      }, 400);
    };

  } catch(e) {
    if (e.message && e.message.includes('cipher')) {
      // File load error
      statusMsg.className = 'status-msg error';
      statusMsg.textContent = e.message;
    } else {
      // Decryption failed = wrong password
      statusMsg.className = 'status-msg error';
      statusMsg.textContent = 'Incorrect password. Try again.';
      pwInput.classList.add('error');
      setTimeout(function() { pwInput.classList.remove('error'); }, 600);
    }
    pwInput.value = '';
    unlockBtn.disabled = false;
    pwInput.focus();
  }
});
</script>
</body>
</html>
